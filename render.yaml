# Render blueprint for CricVault.
# The app is a long-running Express server that keeps its data in a SQLite file,
# so it needs a persistent disk — a static/site-only service will not work.
services:
  - type: web
    name: cricvault
    runtime: node
    plan: starter # a persistent disk requires a paid instance type
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
    disk:
      name: cricvault-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
